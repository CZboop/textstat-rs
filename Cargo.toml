[package]
name = "textstat-rs"
version = "1.0.0-rc.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "textstat_rs"
crate-type = ["cdylib"]

[dependencies]
fancy-regex = "0.18.0"
pyo3 = { version = "0.28.3", features = ["abi3-py310"] }
regex = "1.12.3"

[profile.release]
lto = "fat"
codegen-units = 1
