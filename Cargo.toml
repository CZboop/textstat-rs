[package]
name = "textstat-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "textstat_rs"
crate-type = ["cdylib"]

[dependencies]
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }
pyo3 = "0.28.3"
regex = "1.12.3"
