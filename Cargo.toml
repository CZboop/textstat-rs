[package]
name = "textstat-rs"
version = "2.0.0-rc.1"
edition = "2024"
# Our code only. The vendored data in `src/data/` has its own terms; see the
# notices listed next to `license-files` in pyproject.toml.
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "textstat_rs"
crate-type = ["cdylib"]

[dependencies]
fancy-regex = "0.18.0"
pyo3 = { version = "0.28.3", features = ["abi3-py310"] }
regex = "1.12.3"

[profile.release]
lto = "fat"
codegen-units = 1
# strip debug symbols from published wheels
# to reduce size
strip = true
