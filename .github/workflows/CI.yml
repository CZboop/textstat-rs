# Adapted from `maturin generate-ci github`.
#
# Triggers are split so the expensive wheel matrix doesn't run on every push:
#   - test        -> push to main + PRs + manual dispatch
#   - wheel build -> tags + manual dispatch only
#   - release     -> tags only, publishes to PyPI via OIDC
#
# Pushes to main only pay for the `test` job. Pushing a release
# (`git tag v1.0.0 && git push --tags`) triggers the full build + publish
name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- every push to main/PR ------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # `maturin develop` installs into an active virtualenv, so it needs one to
      # exist. Exporting VIRTUAL_ENV/PATH keeps it active for later steps too.
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build and install
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release --extras dev
          sccache: true
      - name: Run tests
        run: pytest
      # Compares the hand-written .pyi files against the compiled module, so
      # stubs can't silently drift from the `#[pyfunction]` signatures.
      - name: Check type stubs match the compiled module
        run: python -m mypy.stubtest textstat_rs

  # --- tag hygiene: the tag must match the version in Cargo.toml ---------
  # A PyPI version number can never be reused, so publishing under a mismatched
  # tag burns that number permanently. Tag exactly `v<Cargo.toml version>`,
  # e.g. `git tag v1.0.0-rc.1` for version = "1.0.0-rc.1".
  #
  # Runs on every trigger (a no-op off tags) so the wheel jobs can depend on it
  # without `needs` on a skipped job blocking manual dispatch runs.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare tag to Cargo.toml version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Not a tag run, nothing to check."
            exit 0
          fi
          cargo_version=$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/^version = "(.+)"/\1/')
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: ${cargo_version}"
          echo "tag:        ${tag_version}"
          if [ -z "${cargo_version}" ]; then
            echo "::error::Could not read a version from Cargo.toml"
            exit 1
          fi
          if [ "${cargo_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi

  # --- wheel matrix: via tags + manual dispatch only ---------
  linux:
    needs: check-version
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    needs: check-version
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    needs: check-version
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: check-version
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: check-version
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # --- publish: tags only, OIDC trusted publishing (no API token) --------
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [linux, musllinux, windows, macos, sdist]
    environment: pypi
    permissions:
      # OIDC token for PyPI trusted publishing
      id-token: write
      # Used to generate artifact attestation
      attestations: write
      # Needed if you later attach wheels to a GitHub Release
      contents: read
    steps:
      - name: Collect all wheels + sdist into dist/
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # `actions/attest` is the generic action and expects a custom predicate;
      # the build-provenance variant supplies the provenance predicate itself.
      # PyPI gets its own PEP 740 attestations from the publish step below.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # --- rehearsal: manual dispatch only, publishes to TestPyPI ------------
  # Same artifacts as the real release, uploaded to a throwaway index so the
  # whole path can be exercised before a tag exists. Needs its own TestPyPI
  # account, pending publisher (environment `testpypi`) and GitHub environment.
  #
  # `skip-existing` makes a repeat dispatch at the same version a no-op rather
  # than a failure; TestPyPI still won't let an existing version be replaced,
  # so genuinely changed code needs a new version number to rehearse again.
  release-testpypi:
    name: Release (TestPyPI)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist]
    environment: testpypi
    permissions:
      # OIDC token for TestPyPI trusted publishing
      id-token: write
      contents: read
    steps:
      - name: Collect all wheels + sdist into dist/
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
